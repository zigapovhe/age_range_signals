group = "si.povhe.age_range_signals"
version = "1.0-SNAPSHOT"

apply plugin: "com.android.library"

// AGP 9 compiles Kotlin itself unless the host app opts out via
// android.builtInKotlin=false (the "true" fallback matches AGP 9's default).
// On AGP 8, or when the host opted out, the Kotlin plugin must still be
// applied here; the kotlin { compilerOptions } DSL below needs KGP 2.0+.
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
    .getOrElse("true").toBoolean()
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION
    .tokenize('.')[0].toInteger()

if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: "org.jetbrains.kotlin.android"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

android {
    namespace = "si.povhe.age_range_signals"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }

    dependencies {
        implementation("com.google.android.play:age-signals:0.0.3")
        // Explicit artifact + version: KGP's test-framework auto-selection is
        // unavailable when AGP 9 built-in Kotlin is active.
        testImplementation("org.jetbrains.kotlin:kotlin-test-junit5:2.2.20")
        testImplementation("org.mockito:mockito-core:5.20.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
