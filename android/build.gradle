group = "si.povhe.age_range_signals"
version = "1.0-SNAPSHOT"

apply plugin: "com.android.library"

// No KGP here: AGP 9 compiles Kotlin itself, and on AGP 8 or with
// android.builtInKotlin=false the Flutter Gradle plugin (3.47+) applies it.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

android {
    namespace = "si.povhe.age_range_signals"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }

    dependencies {
        implementation("com.google.android.play:age-signals:0.0.6")
        // Explicit artifact + version: KGP's test-framework auto-selection is
        // unavailable when AGP 9 built-in Kotlin is active.
        testImplementation("org.jetbrains.kotlin:kotlin-test-junit5:2.2.20")
        testImplementation("org.mockito:mockito-core:5.20.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
